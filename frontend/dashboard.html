<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Vitals&amp;Vectors</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="topbar">
        <h1 class="display">Command Centre</h1>
        <div class="user-chip" id="user-chip"></div>
      </div>

      <div class="grid grid-3" style="margin-bottom: 20px;">
        <div class="card" id="rank-card">
          <div class="card-title">Rank Status</div>
          <div style="display:flex; align-items:center; gap:16px;">
            <div id="rank-badge-slot"></div>
            <div>
              <div class="stat-value count-up" id="points-total">0</div>
              <div style="color: var(--text-dim); font-size: 13px;" id="rank-label"></div>
            </div>
          </div>
          <div class="progress-track"><div class="progress-fill" id="rank-progress" style="width:0%"></div></div>
          <div style="color: var(--text-dim); font-size: 12px; margin-top: 6px;" id="rank-next-text"></div>
        </div>

        <div class="card">
          <div class="card-title">Streaks</div>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <div class="streak-flame" id="presence-streak"><span class="flame-icon">🔥</span> <span></span></div>
            <div class="streak-flame" id="task-streak"><span class="flame-icon">🔥</span> <span></span></div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Mini Leaderboard</div>
          <div id="mini-leaderboard" class="empty-state">Loading...</div>
        </div>
      </div>

      <div class="grid grid-3" style="margin-bottom: 20px;">
        <div class="card">
          <div class="card-title">Earned This Week</div>
          <div class="stat-value positive" id="earned-week">0</div>
        </div>
        <div class="card">
          <div class="card-title">Net This Week</div>
          <div class="stat-value" id="net-week">0</div>
        </div>
        <div class="card">
          <div class="card-title">Monthly Total</div>
          <div class="stat-value" id="monthly-total">0</div>
        </div>
      </div>

      <div class="grid grid-2">
        <div class="card">
          <div class="card-title">Today's Tasks</div>
          <div id="today-tasks"></div>
        </div>
        <div class="card">
          <div class="card-title">Recent Point Log</div>
          <div id="recent-log"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
