<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Sheet — Vitals&amp;Vectors</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="topbar">
        <h1 class="display">Task Sheet</h1>
        <div class="user-chip" id="user-chip"></div>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Sr. No.</th>
              <th>Activity</th>
              <th>Duration (hrs)</th>
              <th>Deadline</th>
              <th>Assigned By</th>
              <th>Status</th>
              <th>Points</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tasks-body"></tbody>
        </table>
        <div id="tasks-empty" class="empty-state" style="display:none;">No tasks assigned yet</div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
