<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Point Log — Vitals&amp;Vectors</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="topbar">
        <h1 class="display">Point Log</h1>
        <div class="user-chip" id="user-chip"></div>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Date &amp; Time</th>
              <th>Event</th>
              <th>Category</th>
              <th>Points</th>
              <th>Reason</th>
              <th>Logged By</th>
            </tr>
          </thead>
          <tbody id="log-body"></tbody>
        </table>
        <div id="log-empty" class="empty-state" style="display:none;">No point events logged yet</div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/point-log.js"></script>
</body>
</html>
