<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitals&Vectors — System Login</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #00c8ff;
      --blue-glow: rgba(0, 200, 255, 0.3);
      --teal: #00E5FF;
      --purple: #9b59ff;
      --red: #ff3b5c;
      --bg: #050a14;
      --card-bg: #080f1e;
      --border: rgba(0, 200, 255, 0.15);
      --text: #e8f4ff;
      --muted: #8899aa;
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* ── BACKGROUND LAYER ── */
    /* Replace .bg-layer with your actual background image.
     In your IDE: body { background: url('your-bg.png') center/cover no-repeat; }
     and remove the .bg-layer element entirely. */
    body {
      background: url('asset/login_background.png') center/cover no-repeat;
      /* ↓ SWAP THIS for your image: background: url('bg.png') center/cover no-repeat; */
    }

    /* Subtle grid overlay (matches the blue grid lines in the reference) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 200, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 200, 255, 0.025) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial top-center glow (the blue burst from top in the image) */
    body::after {
      content: '';
      position: fixed;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 600px;
      background: radial-gradient(ellipse at center top, rgba(0, 200, 255, 0.09) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── CENTER WRAPPER ── */
    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── LOGIN CARD ── */
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid rgba(0, 229, 255, 0.3);
      box-shadow:
        0 0 0 1px rgba(154, 123, 255, 0.15),
        0 0 40px rgba(0, 200, 255, 0.1),
        0 0 80px rgba(0, 200, 255, 0.05),
        -2px 0 20px rgba(0, 229, 255, 0.08) inset,
        2px 0 20px rgba(154, 123, 255, 0.08) inset,
        inset 0 0 60px rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      padding: 48px 44px 40px;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.5s ease both;

      /* Outer glows matching image */
      box-shadow:
        0 0 0 1px rgba(0, 200, 255, 0.08),
        0 0 40px rgba(0, 200, 255, 0.08),
        0 0 80px rgba(0, 200, 255, 0.04),
        inset 0 0 60px rgba(0, 0, 0, 0.4);
    }

    /* Top gradient accent line — cyan left → purple right, follows rounded corners */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      border-radius: 12px 12px 0 0;
      background: linear-gradient(90deg,
          #00E5FF 0%,
          #00c8ff 30%,
          #7B5CFF 65%,
          #9A7BFF 100%);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.5), 0 0 24px rgba(154, 123, 255, 0.3);
    }

    /* Corner cut marks (top-left, top-right — visible in reference) */
    .card::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(0, 200, 255, 0.05);
    }

    /* Corner decorators */
    .corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: rgba(0, 200, 255, 0.4);
      border-style: solid;
    }

    .corner.tl {
      top: 8px;
      left: 8px;
      border-width: 1px 0 0 1px;
    }

    .corner.tr {
      top: 8px;
      right: 8px;
      border-width: 1px 1px 0 0;
    }

    .corner.bl {
      bottom: 8px;
      left: 8px;
      border-width: 0 0 1px 1px;
    }

    .corner.br {
      bottom: 8px;
      right: 8px;
      border-width: 0 1px 1px 0;
    }

    /* ── LOGO ── */
    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.6rem;
      letter-spacing: 0.06em;
      color: var(--teal);
      display: block;
      line-height: 1;
    }

    /* ── SUBTITLE ── */
    .subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--blue);
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 20px;
      opacity: 0.85;
    }

    /* ── AUTH TAG PILL ── */
    .auth-tag {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 auto 32px;
      width: fit-content;
      padding: 7px 20px;
      background: rgba(0, 200, 255, 0.07);
      border: 1px solid rgba(0, 200, 255, 0.25);
      border-radius: 20px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--blue);
      text-transform: uppercase;
    }

    .auth-tag svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    /* ── FORM ── */
    .field {
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--muted);
      pointer-events: none;
      flex-shrink: 0;
    }

    .input-icon svg {
      width: 18px;
      height: 18px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 14px 44px;
      background: rgba(10, 10, 20, 0.8);
      border: 1px solid rgba(0, 200, 255, 0.2);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
      -webkit-appearance: none;
    }

    input::placeholder {
      color: var(--muted);
      opacity: 0.7;
    }

    input:focus {
      border-color: rgba(0, 200, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.08), 0 0 16px rgba(0, 200, 255, 0.1);
    }

    /* Eye toggle for password */
    .eye-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .eye-btn:hover {
      color: var(--blue);
    }

    .eye-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ── SUBMIT BUTTON ── */
    .btn-submit {
      width: 100%;
      padding: 16px;
      margin-top: 8px;
      background: linear-gradient(90deg, #1565C0 0%, #29B6F6 35%, #00E5FF 75%, #00FFFF 100%);
      border: none;
      border-radius: 8px;
      color: #0A0A0F;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.12em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: opacity 0.2s, box-shadow 0.2s, transform 0.15s;
      box-shadow: 0 4px 24px rgba(0, 229, 255, 0.25), 0 0 40px rgba(0, 200, 255, 0.15);
    }

    .btn-submit::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: rgba(255, 255, 255, 0.15);
      transform: skewX(-20deg);
      transition: left 0.5s;
      pointer-events: none;
    }

    .btn-submit:hover::before {
      left: 120%;
    }

    .btn-submit:hover {
      box-shadow: 0 4px 32px rgba(0, 229, 255, 0.4), 0 0 60px rgba(0, 200, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
      opacity: 0.9;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Loading spinner inside button */
    .btn-submit .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(10, 10, 20, 0.3);
      border-top-color: #0A0A0F;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    .btn-submit.loading .btn-text {
      display: none;
    }

    .btn-submit.loading .spinner {
      display: block;
    }

    /* ── ERROR MESSAGE ── */
    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 10px 14px;
      background: rgba(255, 23, 68, 0.06);
      border: 1px solid rgba(255, 23, 68, 0.25);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #FF5252;
      animation: fadeIn 0.3s ease;
    }

    .error-msg.visible {
      display: flex;
    }

    .error-msg svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: #FF5252;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Bottom floor glow (the teal ring/glow under the card in the image) */
    .floor-glow {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 200px;
      background: radial-gradient(ellipse at center bottom, rgba(0, 200, 255, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>

<body>

  <div class="floor-glow"></div>

  <div class="wrapper">
    <div class="card">
      <!-- Corner decorators -->
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <!-- Logo -->
      <div class="logo">
        <span class="logo-text">VITALS&amp;VECTORS</span>
      </div>

      <!-- Subtitle -->
      <div class="subtitle">// &nbsp;Monitoring System Online</div>

      <!-- Auth tag pill -->
      <div class="auth-tag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
        System Authentication Required
      </div>

      <!-- Form -->
      <div class="field">
        <label class="field-label" for="username">Username</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <input type="text" id="username" placeholder="Enter hunter ID" autocomplete="username" spellcheck="false">
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0110 0v4" />
            </svg>
          </span>
          <input type="password" id="password" placeholder="Enter access key" autocomplete="current-password">
          <button class="eye-btn" type="button" id="eyeBtn" aria-label="Toggle password visibility">
            <!-- eye icon -->
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <!-- eye-off icon (hidden initially) -->
            <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path
                d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button class="btn-submit" id="loginBtn" type="button">
        <span class="btn-text">Initialize Session</span>
        <div class="spinner"></div>
      </button>

      <!-- Error message -->
      <div class="error-msg" id="errorMsg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
        Invalid username or password. Please try again.
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // ── Eye toggle ──────────────────────────────────────────
    const eyeBtn = document.getElementById('eyeBtn');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');
    const pwInput = document.getElementById('password');

    eyeBtn.addEventListener('click', () => {
      const visible = pwInput.type === 'text';
      pwInput.type = visible ? 'password' : 'text';
      eyeIcon.style.display = visible ? 'block' : 'none';
      eyeOffIcon.style.display = visible ? 'none' : 'block';
    });

    // ── Login handler ───────────────────────────────────────
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = pwInput.value;

      if (!username || !password) {
        showError('Please enter your hunter ID and access key.');
        return;
      }

      // Loading state
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;
      errorMsg.classList.remove('visible');

      try {
        const data = await api.login(username, password);

        // Store JWT in localStorage
        localStorage.setItem('vv_token', data.access_token);
        localStorage.setItem('vv_role', data.role);
        localStorage.setItem('vv_id', data.member_id);
        localStorage.setItem('vv_name', data.name);

        // Redirect
        window.location.href = 'dashboard.html';

      } catch (err) {
        showError('Invalid username or password. Please try again.');
      } finally {
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
      }
    }

    function showError(msg) {
      errorMsg.querySelector('span') && (errorMsg.querySelector('span').textContent = msg);
      // Update text node
      const nodes = [...errorMsg.childNodes];
      const textNode = nodes.find(n => n.nodeType === 3 && n.textContent.trim());
      if (textNode) textNode.textContent = msg;
      else {
        // fallback: set inner content around the svg
        const svg = errorMsg.querySelector('svg');
        errorMsg.innerHTML = '';
        errorMsg.appendChild(svg);
        errorMsg.appendChild(document.createTextNode(' ' + msg));
      }
      errorMsg.classList.add('visible');
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    loginBtn.addEventListener('click', doLogin);

    // Clear error on input
    document.getElementById('username').addEventListener('input', () => errorMsg.classList.remove('visible'));
    pwInput.addEventListener('input', () => errorMsg.classList.remove('visible'));
  </script>
</body>

</html>
